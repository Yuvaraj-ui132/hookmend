name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/hookmend_ci
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-test-admin-token-placeholder
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Build dashboard
        run: npm run build:dashboard

      - name: npm audit (prod dependencies only, fail on high+)
        # Full audit (npm audit) shows 8 vulnerabilities:
        #   - 2 critical, 1 high, 5 moderate in DEV dependencies: tinypool (vitest internals), esbuild/vite (vitest), vitest/mocker
        #   - 2 moderate in PROD: react-router 6.x (GHSA-wrjc-x8rr-h8h6, GHSA-337j-9hxr-rhxg)
        # --omit=dev leaves only the 2 moderate react-router advisories.
        # react-router fix requires a breaking v6->v7 upgrade; tracked separately.
        # These react-router CVEs affect SSR hydration and <Link> redirect -- no server-side attack surface
        # in the static SPA dashboard. Using --audit-level=high (not critical) is intentional:
        # it would fail on any newly introduced high/critical prod dependency.
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration Exit Tests + Chaos
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Mongo to be healthy
        run: |
          echo "Polling MongoDB..."
          timeout=60
          while ! node -e "const { MongoClient } = require('mongodb'); const c = new MongoClient('mongodb://localhost:27017/admin?directConnection=true', { serverSelectionTimeoutMS: 2000 }); c.connect().then(() => c.db('admin').command({ ping: 1 })).then(() => { c.close(); process.exit(0); }).catch(() => process.exit(1));" >/dev/null 2>&1; do
            timeout=$((timeout - 1))
            if [ $timeout -le 0 ]; then
              echo "MongoDB did not become healthy in time"
              docker logs $(docker ps -q --filter ancestor=mongo:7) || true
              exit 1
            fi
            sleep 1
          done
          echo "MongoDB is healthy"

      - name: Wait for Redis to be healthy
        run: |
          echo "Polling Redis..."
          timeout=60
          while ! node -e "const Redis = require('ioredis'); const r = new Redis('redis://localhost:6379', { maxRetriesPerRequest: 1, connectTimeout: 2000, retryStrategy: () => null, lazyConnect: true }); r.on('error', () => {}); r.connect().then(() => r.ping()).then(() => { r.disconnect(); process.exit(0); }).catch(() => process.exit(1));" >/dev/null 2>&1; do
            timeout=$((timeout - 1))
            if [ $timeout -le 0 ]; then
              echo "Redis did not become healthy in time"
              docker logs $(docker ps -q --filter ancestor=redis:7) || true
              exit 1
            fi
            sleep 1
          done
          echo "Redis is healthy"

      - name: Run seed
        run: npm run seed
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-seed
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Phase 1 exit test
        run: npm run exit-test:phase1
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-phase1
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Phase 2 exit test
        run: npm run exit-test:phase2
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-phase2
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Phase 3A exit test
        run: npm run exit-test:phase3a
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-phase3a
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret
          ENABLE_AI: "false"

      - name: Phase 3B exit test
        run: npm run exit-test:phase3b
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-phase3b
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Phase 4 exit test
        run: npm run exit-test:phase4
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-phase4
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret
          NODE_ENV: test

      - name: Chaos scenarios C1, C2, C4 (CI subset)
        # C3 (Redis FLUSHALL) and C5/C6 (downstream outage with retry window) use docker compose
        # to stop/start service containers, which conflicts with GH Actions service container lifecycle.
        # C7 (AI rate limit) has no meaningful failure mode in CI since ENABLE_AI=false.
        # C1, C2, C4 are safe: they use ioredis directly or kill/respawn workers, not service containers.
        run: npm run chaos -- --ci --only C1,C2,C4
        env:
          MONGODB_URI: mongodb://localhost:27017/hookmend?directConnection=true
          REDIS_URL: redis://localhost:6379
          ADMIN_API_TOKEN: ci-integration-admin-token-chaos
          SIM_WEBHOOK_SECRET: ci-sim-secret
          GITHUB_WEBHOOK_SECRET: ci-github-secret

      - name: Upload CHAOS.md artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: docs/CHAOS.md

      - name: Teardown docker compose
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v || true
